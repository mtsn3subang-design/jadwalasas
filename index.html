<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASAS Ganjil 2026/2027 · MTsN 3 Subang</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f2e6;--card:#fffdf6;--ink:#0d2b21;--mut:#5d6f66;--line:#e3d9b8;--em:#0b5d3f;--gold:#b98a24;--gl:#f0d98a;--tok:#eaf3ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#04170f;--card:#0a2a1e;--ink:#f1ead2;--mut:#9db3a7;--line:#1c4a37;--tok:#06180f}}
:root[data-theme="dark"]{--bg:#04170f;--card:#0a2a1e;--ink:#f1ead2;--mut:#9db3a7;--line:#1c4a37;--tok:#06180f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Poppins,system-ui,sans-serif}
header{background:radial-gradient(120% 160% at 50% 0,#0f7a52,#04281d);color:#fff;padding:22px 16px 26px;border-bottom:3px solid var(--gold);text-align:center}
.hd{max-width:880px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd img{height:64px;width:auto;flex:none}
.hd small{display:block;letter-spacing:.22em;font-size:10.5px;color:var(--gl);text-transform:uppercase}
.hd h1{font:700 clamp(28px,7vw,46px)/1.1 Lora,Georgia,serif;margin:4px 0;background:linear-gradient(#fff3c4,#d9ad45 60%,#f0d98a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hd p{margin:0;font-size:12.5px;letter-spacing:.08em;color:#e8f1ea}
main{max-width:880px;margin:auto;padding:16px}
.pick{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row b{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);width:64px}
button,.btn{font:500 14px Poppins,sans-serif;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 16px;text-decoration:none;display:inline-block}
button.on{background:var(--em);border-color:var(--em);color:#fff}
.cd{margin:14px 0;padding:10px 14px;border-radius:12px;background:linear-gradient(90deg,#0b5d3f,#0f7a52);color:#fff;font-size:13.5px}
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px}
.days button{flex:none;text-align:center;line-height:1.25;border-radius:14px}
.days button span{display:block;font-size:11px;opacity:.75}
.days button.today{border-color:var(--gold)}
.s{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:14px;padding:14px;margin-bottom:10px;display:grid;grid-template-columns:110px 1fr;gap:6px 14px}
.s .t{font-size:13px;color:var(--mut)}.s .t b{display:block;color:var(--ink);font-size:15px}
.s h3{margin:0;font:700 19px Lora,Georgia,serif}
.live{display:inline-block;background:#c0392b;color:#fff;border-radius:999px;font:600 10.5px Poppins;padding:1px 9px;margin-left:8px;vertical-align:middle}
.act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:6px}
.tok{font:600 22px ui-monospace,Menlo,monospace;letter-spacing:.18em;background:var(--tok);border:1px dashed var(--gold);border-radius:10px;padding:6px 14px}
.go{background:var(--em);color:#fff;border-color:var(--em)}
.none{color:var(--mut);font-size:13px}
.brk{text-align:center;color:var(--mut);font-size:12.5px;letter-spacing:.12em;padding:4px 0 12px}
.adm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0 0;padding:10px 14px;border:1px dashed var(--gold);border-radius:12px;font-size:13px}
.adm[hidden],[hidden]{display:none!important}
.ed input{font:14px Poppins,sans-serif;color:var(--ink);background:var(--tok);border:1px solid var(--line);border-radius:10px;padding:8px 12px;flex:1 1 260px;min-width:0}
.ed input[data-f=k]{flex:0 1 150px;font-family:ui-monospace,Menlo,monospace;letter-spacing:.12em}
.s.e{grid-template-columns:1fr}.s.e .ed input{flex:1 1 200px}.s.e .tm{flex:0 1 170px!important}.s.e .jm{flex:0 1 80px!important}.dl{color:#c0392b;border-color:#c0392b;font-size:12.5px;padding:4px 12px}
.note{color:var(--mut);font-size:12.5px;text-align:center;margin:18px 0 4px}
@media(max-width:520px){.s{grid-template-columns:1fr}.hd img{height:46px}.row b{width:100%}}
</style></head><body>

function fromHash(){const m=/^#kelas-(VII|VIII|IX)-([A-Z])$/.exec(location.hash);if(m&&D[m[1]].rombel.includes(m[2])){st.lv=m[1];st.rb=m[2];return true}return false}
function saved(){try{const v=JSON.parse(localStorage.getItem('asas')||'null');if(v&&D[v.lv]&&D[v.lv].rombel.includes(v.rb)){st.lv=v.lv;st.rb=v.rb}}catch(e){}}
function pickDay(){const t=todayWIB(),ds=D[st.lv].days;let i=ds.findIndex(d=>d.date>=t);st.day=i<0?ds.length-1:i}
function chips(el,items,cur,fn){el.innerHTML='';items.forEach(x=>{const b=document.createElement('button');b.textContent=x;if(x===cur)b.className='on';b.onclick=()=>fn(x);el.appendChild(b)})}
function render(){
 const L=D[st.lv];
 chips($('lv'),['VII','VIII','IX'],st.lv,v=>{st.lv=v;if(!D[v].rombel.includes(st.rb))st.rb=D[v].rombel[0];pickDay();sync()});
 chips($('rb'),L.rombel,st.rb,v=>{st.rb=v;sync()});
 const t=todayWIB(),ds=L.days,f=ds[0].date,l=ds[ds.length-1].date;
 const diff=Math.round((Date.parse(f)-Date.parse(t))/864e5);
 $('cd').textContent=t<f?`ASAS dimulai ${diff} hari lagi — ${ds[0].label}`:t<=l?'ASAS sedang berlangsung. Semangat mengerjakan!':'ASAS Ganjil telah selesai. Terima kasih.';
 $('days').innerHTML='';
 ds.forEach((d,i)=>{const b=document.createElement('button');const dt=new Date(d.date+'T00:00:00Z');
  b.innerHTML=`${HR[dt.getUTCDay()]}<span>${dt.getUTCDate()} ${MO[dt.getUTCMonth()]}</span>`;
  b.className=(i===st.day?'on ':'')+(d.date===t?'today':'');b.onclick=()=>{st.day=i;render()};$('days').appendChild(b)});
 const day=ds[st.day],now=Date.now();let h=edit?`<div class="act ed"><label>Tanggal hari ini</label><input type="date" data-d="${st.day}" data-f="date" value="${day.date}" style="flex:0 1 190px"></div>`:'';
 day.rows.forEach((r,ri)=>{
  if(r.brk&&!edit){h+=`<div class="brk">☾ ISTIRAHAT · ${r.t}</div>`;return}
  const c=(r.c||{})[st.rb]||{},[a,b]=r.t.split(' – ');
  if(edit){const at=f=>`data-d="${st.day}" data-r="${ri}" data-f="${f}"`;h+=`<article class="s e"><div class="act ed" style="margin:0"><input class="tm" ${at('t')} value="${esc(r.t)}" aria-label="Waktu"><input class="jm" ${at('j')} value="${esc(r.j)}" placeholder="Jam" aria-label="Jam ke"><input ${at('m')} value="${esc(r.m)}" aria-label="Mata pelajaran"></div>${r.brk?'':`<div class="act ed"><input ${at('l')} type="url" placeholder="Tautan soal (https://…)" value="${esc(c.l)}"><input ${at('k')} placeholder="Token" value="${esc(c.k)}"></div>`}<div class="act"><button class="dl" data-del="${ri}">Hapus sesi</button></div></article>`;return}
  const live=now>=toMs(day.date,a)&&now<=toMs(day.date,b);
  const tok=c.k?`<span class="tok">${esc(c.k)}</span><button data-k="${esc(c.k)}">Salin token</button>`:'<span class="none">Tanpa token</span>';
  const go=c.l?`<a class="btn go" target="_blank" rel="noopener" href="${esc(c.l)}">Buka soal ↗</a>`:'<span class="none">Tautan soal belum diisi</span>';
  h+=`<article class="s"><div class="t"><b>${r.t}</b>Jam ke-${r.j}</div><h3>${r.m}${live?'<span class="live">● BERLANGSUNG</span>':''}</h3><div class="act">${go}${tok}</div></article>`});
 $('list').innerHTML=`<p class="note" style="text-align:left;margin:0 0 10px">${day.label} · Kelas ${st.lv} ${st.rb}</p>`+h+(edit?'<button data-add="1">＋ Tambah sesi</button>':'');
}
function sync(){location.hash='kelas-'+st.lv+'-'+st.rb;try{localStorage.setItem('asas',JSON.stringify({lv:st.lv,rb:st.rb}))}catch(e){}render()}
$('list').addEventListener('click',e=>{const k=e.target.dataset&&e.target.dataset.k;if(!k)return;
 const done=()=>{e.target.textContent='Tersalin ✓';setTimeout(()=>e.target.textContent='Salin token',1500)};
 const fb=()=>{const x=document.createElement('textarea');x.value=k;document.body.appendChild(x);x.select();try{document.execCommand('copy');done()}catch(_){}x.remove()};
 try{navigator.clipboard.writeText(k).then(done,fb)}catch(_){fb()}});
function bar(){$('ed').textContent=edit?'✓ Selesai edit':'✎ Mode edit';$('all').hidden=!edit;$('ex').hidden=!edit;$('sv').hidden=!dirty;$('dl').hidden=!(edit&&SA);$('ei').textContent=dirty?dirty+' perubahan belum disimpan':(edit?'Ubah tautan atau token, lalu simpan.':'')}
$('adm').addEventListener('click',e=>{const id=e.target.id,L=D[st.lv];
 if(id==='ar'){const n=String.fromCharCode(L.rombel[L.rombel.length-1].charCodeAt(0)+1);if(n>'Z')return;L.rombel.push(n);st.rb=n;dirty++;bar();render()}
 if(id==='dr'&&L.rombel.length>1){L.rombel=L.rombel.filter(x=>x!==st.rb);L.days.forEach(d=>d.rows.forEach(r=>{if(r.c)delete r.c[st.rb]}));st.rb=L.rombel[0];dirty++;bar();render()}
 if(id==='ad'){const cur=L.days[st.day],d=new Date(L.days[L.days.length-1].date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);const v=d.toISOString().slice(0,10);
  L.days.push({date:v,label:lab(v),rows:cur.rows.map(r=>r.brk?{t:r.t,j:r.j,m:r.m,brk:true}:{t:r.t,j:r.j,m:'MATA PELAJARAN',brk:false,c:{}})});st.day=L.days.length-1;dirty++;bar();render()}
 if(id==='dd'&&L.days.length>1){L.days.splice(st.day,1);st.day=Math.max(0,st.day-1);dirty++;bar();render()}});
$('ed').onclick=()=>{edit=!edit;bar();render()};
$('list').addEventListener('change',e=>{const i=e.target,f=i.dataset&&i.dataset.f;if(!f)return;
 const day=D[st.lv].days[i.dataset.d];let v=i.value.trim();const p=n=>String(n).padStart(2,'0');
 if(f==='date'){if(!v)return;day.date=v;day.label=lab(v);D[st.lv].days.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);st.day=D[st.lv].days.indexOf(day);dirty++;bar();render();return}
 const r=day.rows[i.dataset.r];
 if(f==='t'){const m=/^(\d{1,2})[.:](\d{2})\s*[–-]\s*(\d{1,2})[.:](\d{2})$/.exec(v);if(!m){$('ei').textContent='Format waktu: 07.00 – 08.30';i.value=r.t;return}r.t=p(m[1])+'.'+m[2]+' – '+p(m[3])+'.'+m[4];dirty++;bar();render();return}
 if(f==='j'||f==='m'){if(f==='m'){v=v.toUpperCase();r.brk=v==='ISTIRAHAT';if(!r.brk&&!r.c)r.c={}}r[f]=v;dirty++;bar();render();return}
 v=v.replace(/\s+/g,'');
 if(f==='l'&&v&&!/^https?:\/\//i.test(v)){$('ei').textContent='Tautan harus diawali https://';i.value='';return}
 const r2=r,ks=$('ap').checked?D[st.lv].rombel:[st.rb];
 ks.forEach(k=>{(r2.c[k]=r2.c[k]||{})[f]=v||null});dirty++;bar()});
$('list').addEventListener('click',e=>{const d=e.target.dataset||{},rows=D[st.lv].days[st.day].rows;
 if(d.del!==undefined){rows.splice(+d.del,1);dirty++;bar();render()}
 if(d.add!==undefined){rows.push({t:'07.00 – 08.30',j:String(rows.length+1),m:'MATA PELAJARAN',brk:false,c:{}});dirty++;bar();render()}});
$('dl').onclick=()=>{const j=JSON.stringify(D).replace(/</g,'\\u003c');
 const h=SRC.replace(/(<script id="seed"[^>]*>)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b).replace(/const BUILT=\d+;/,'const BUILT='+Date.now()+';');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='asas_ganjil_2026-2027.html';document.body.appendChild(a);a.click();a.remove();$('ei').textContent='File terbaru diunduh. Unggah file ini ke hosting/web sekolah untuk membagikannya.'};
if(SA){$('adm').hidden=false;bar()}
$('sv').onclick=async()=>{
 if(SA){try{localStorage.setItem('asas-data',JSON.stringify({b:BUILT,d:D}));dirty=0;bar();$('ei').textContent='Tersimpan di browser ini. Klik Unduh file terbaru untuk membagikannya.'}catch(x){$('ei').textContent='Gagal menyimpan di browser ini. Gunakan Unduh file terbaru.';$('dl').hidden=false}return}
 if(!ART)return;$('sv').disabled=true;$('ei').textContent='Menyimpan…';
 try{const j=JSON.stringify(D).replace(/</g,'\\u003c');
  await ART.publish(SRC.replace(/(<script id="seed"[^>]*>)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b))}
 catch(x){$('ei').textContent=x&&x.code==='conflict'?'Ada perubahan lain, halaman dimuat ulang.':'Gagal menyimpan: '+((x&&x.code)||'coba lagi');$('sv').disabled=false}};
(async()=>{try{if(!window.claude)return;const u=await claude.use('user'),a=await claude.use('artifact');if(u&&a&&u.canEdit()){ART=a;$('adm').hidden=false;bar()}}catch(e){}})();
addEventListener('hashchange',()=>{if(fromHash()){pickDay();render()}});
if(!fromHash())saved();pickDay();render();
</script></body></html>
